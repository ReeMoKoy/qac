<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAC AI - Daily & Coding Assistant</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --code-bg: #090d13;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

    /* Header & Controls */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--text-bold); display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; gap: 10px; align-items: center; }

    select, button {
      background: var(--bg);
      color: var(--text-bold);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    select:focus, button:focus { border-color: #58a6ff; }

    /* Chat Messages Box */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 8px;
      line-height: 1.5;
      border: 1px solid transparent;
    }
    .message.user {
      background-color: #1f242c;
      border-color: var(--border);
      align-self: flex-end;
    }
    .message.assistant {
      background-color: var(--card-bg);
      border-color: var(--border);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #21262d;
      color: #58a6ff;
      margin-bottom: 6px;
      font-family: monospace;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      color: #e6edf3;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.85rem;
    }

    /* Input Footer */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }
    .input-form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-bold);
      padding: 10px 14px;
      font-size: 0.95rem;
      resize: none;
      height: 48px;
      outline: none;
    }
    textarea:focus { border-color: #58a6ff; }
    .send-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 0 18px;
      font-weight: 600;
    }
    .send-btn:hover { background-color: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ QAC AI</div>
    <div class="controls">
      <!-- Mode Selection -->
      <select id="mode-select">
        <option value="daily">Daily Life Mode</option>
        <option value="coding">Coding Mode</option>
      </select>

      <!-- QAC AI Tier Selection -->
      <select id="model-select">
        <option value="QacAI-Flash-lite">QacAI-Flash-lite (Fastest)</option>
        <option value="QacAI-Flash" selected>QacAI-Flash (Balanced)</option>
        <option value="QacAI-Ultra">QacAI-Ultra (Deep Logic)</option>
      </select>
    </div>
  </header>

  <!-- Message History Display -->
  <main id="chat-box">
    <div class="message assistant">
      <div class="badge">QAC AI System</div>
      <div>Hello! I am <strong>QAC AI</strong>. Choose a mode above (Daily Life or Coding) and ask me anything to get started.</div>
    </div>
  </main>

  <!-- Input Form -->
  <footer>
    <form class="input-form" id="chat-form">
      <textarea id="prompt-input" placeholder="Type a message or code question... (Enter to send, Shift+Enter for newline)"></textarea>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const promptInput = document.getElementById('prompt-input');
    const modeSelect = document.getElementById('mode-select');
    const modelSelect = document.getElementById('model-select');

    // Conversation history kept in memory
    const conversation = [];

    // Auto submit on Enter (without Shift)
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = promptInput.value.trim();
      if (!userText) return;

      const mode = modeSelect.value;
      const model = modelSelect.value;

      // 1. Render user message
      appendMessage('user', 'You', userText);
      promptInput.value = '';

      // 2. Add to context history
      conversation.push({ role: 'user', content: userText });

      // 3. Create placeholder assistant message
      const assistantDiv = appendMessage('assistant', `${model} (${mode.toUpperCase()})`, 'Thinking...');

      try {
        // Send request to your backend or serverless route
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversation,
            mode: mode,
            tier: model
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        const reply = data.reply || 'No response received.';
        
        // Render final response and save to history
        assistantDiv.querySelector('.content').innerHTML = formatMarkdown(reply);
        conversation.push({ role: 'assistant', content: reply });
      } catch (err) {
        assistantDiv.querySelector('.content').innerHTML = `<span style="color: #f85149;">Error: ${err.message}</span>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function appendMessage(sender, label, text) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = `
        <div class="badge">${label}</div>
        <div class="content">${formatMarkdown(text)}</div>
      `;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    // Basic markdown formatter for code blocks
    function formatMarkdown(text) {
      return text
        .replace(/```([\s\S]*?)```/g, (match, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`)
        .replace(/\n/g, '<br/>');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
