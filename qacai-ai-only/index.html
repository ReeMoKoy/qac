<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QACAI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#eee;font-family:Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}.hidden{display:none!important}
#app{height:100vh;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0f0f12}.brand{font-weight:800;font-size:21px;background:linear-gradient(90deg,#a78bfa,#ec4899,#22d3ee,#a78bfa);background-size:300% 300%;-webkit-background-clip:text;color:transparent;animation:rgb 5s linear infinite}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #3f3f46;background:#18181b;color:#eee;border-radius:10px;padding:8px 12px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#7c3aed,#a855f7);border:0}.btn.danger{background:#4c1d1d;border-color:#7f1d1d}.select{background:#18181b;color:#eee;border:1px solid #3f3f46;border-radius:9px;padding:8px}.main{display:flex;flex:1;min-height:0}.side{width:240px;border-right:1px solid #27272a;background:#0c0c0f;padding:12px;display:flex;flex-direction:column}.newchat{width:100%;margin-bottom:10px}.history{flex:1;overflow:auto}.hist{padding:9px 10px;border-radius:9px;margin:4px 0;color:#a1a1aa;cursor:pointer}.hist.active{background:#1f1f23;color:#fff}.userbar{padding-top:10px;border-top:1px solid #27272a;font-size:12px;color:#a1a1aa}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.messages{flex:1;overflow:auto;padding:24px}.inner{max-width:900px;margin:0 auto}.bubble{max-width:80%;padding:12px 15px;border-radius:16px;margin:10px 0;line-height:1.55;white-space:pre-wrap}.me{background:#6d28d9;margin-left:auto}.ai{background:#18181b;border:1px solid #27272a}.composer{padding:14px 22px 20px}.composeRow{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:end}.input{flex:1;background:#18181b;border:1px solid #3f3f46;color:#eee;border-radius:18px;padding:14px 16px;min-height:52px;max-height:180px;resize:vertical;outline:none}.send{width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:20px;cursor:pointer}.meta{max-width:900px;margin:8px auto 0;color:#71717a;font-size:11px;display:flex;gap:12px;justify-content:center}.thinking{display:flex;gap:8px;align-items:center;color:#c4b5fd;padding:10px 0}.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a855f7;margin-right:4px;animation:dot 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}.multi{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50}.multiBox{width:min(1250px,95vw);max-height:90vh;overflow:auto;background:#101014;border:1px solid #27272a;border-radius:18px;padding:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#18181b;border:1px solid #2f2f35;border-radius:14px;padding:14px;min-height:260px}.card h3{margin:0 0 8px}.cardBody{white-space:pre-wrap;line-height:1.5;color:#d4d4d8}.login{height:100%;display:flex;align-items:center;justify-content:center;background:#09090b}.loginBox{width:390px;background:#111114;border:1px solid #27272a;border-radius:18px;padding:24px}.loginBox h1{text-align:center}.field{width:100%;background:#0d0d10;border:1px solid #3f3f46;color:#eee;border-radius:9px;padding:11px;margin:7px 0;outline:none}.status{min-height:18px;color:#a1a1aa;font-size:12px;text-align:center;margin:5px 0}.admin{position:fixed;inset:0;background:#09090b;z-index:80;overflow:auto;padding:20px}.adminGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.userCard{background:#18181b;border:1px solid #2f2f35;border-radius:12px;padding:12px}.activeDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px}.warn{color:#fbbf24}.ok{color:#4ade80}.rgb{animation:rgb 4s linear infinite;background-size:300% 300%;background-image:linear-gradient(90deg,#a78bfa,#ec4899,#22d3ee,#4ade80,#a78bfa);-webkit-background-clip:text;color:transparent}@keyframes rgb{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes dot{50%{transform:translateY(-4px);opacity:.5}}@media(max-width:800px){.side{width:190px}.cards{grid-template-columns:1fr}.bubble{max-width:92%}}
</style></head><body>
<div id="root"></div>
<script>
const state={user:null,token:null,model:localStorage.getItem('qac_model')||'flash1',lang:localStorage.getItem('qac_lang')||'tr',db:{},history:[],currentChat:[],multiOpen:false,scanning:0,responses:0};
const MODELS={flash1:{name:'QACAI Flash 1',delay:350},flashlite1:{name:'QACAI Flash-Lite 1',delay:650},ultra211:{name:'QACAI Ultra 21.1',delay:900}};
const ADMIN_NAME='ReeMoKoy';
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderLogin(msg=''){root.innerHTML=`<div class="login"><div class="loginBox"><h1 class="rgb">QACAI</h1><p style="text-align:center;color:#71717a">Sadece yapay zeka</p><input id="u" class="field" placeholder="Kullanıcı adı"><input id="p" class="field" type="password" placeholder="Şifre"><div id="st" class="status">${esc(msg)}</div><div style="display:flex;gap:8px"><button class="btn primary" style="flex:1" onclick="auth('login')">Giriş</button><button class="btn" style="flex:1" onclick="auth('register')">Kayıt</button></div><p style="color:#52525b;font-size:11px;text-align:center;margin-top:14px">ReeMoKoy hesabı yönetici olarak işaretlenir. Güvenli çok-kullanıcılı aktiflik için server.cjs gerekir.</p></div></div>`;}
async function auth(mode){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p)return;document.getElementById('st').textContent='İşleniyor...';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,username:u,password:p})});if(!r.ok)throw new Error('api');const d=await r.json();if(!d.ok)throw new Error(d.message||'Hata');state.user=d.user;state.token=d.token;localStorage.setItem('qac_session',JSON.stringify({user:d.user,token:d.token}));startApp();}catch(e){const ok=mode==='login' || mode==='register';if(!ok)return;state.user={username:u,role:u===ADMIN_NAME?'admin':'user'};state.token='local';localStorage.setItem('qac_session',JSON.stringify({user:state.user,token:'local'}));startApp();}}
function startApp(){renderApp();loadModel(state.model);heartbeat();setInterval(heartbeat,15000);}
function renderApp(){root.innerHTML=`<div id="app"><header class="top"><div class="brand">QACAI</div><div class="actions"><select class="select" onchange="setLang(this.value)" value="${state.lang}"><option value="tr">Türkçe</option><option value="en">English</option></select><select class="select" onchange="selectModel(this.value)"><option value="flash1">⚡ Flash 1 — kısa</option><option value="flashlite1">🚀 Flash-Lite 1 — orta</option><option value="ultra211">🌌 Ultra 21.1 — uzun</option></select><button class="btn" onclick="openMulti()">⚡ Multi-Chat</button>${state.user&&state.user.role==='admin'?'<button class="btn" onclick="openAdmin()">👑 Yönetim</button>':''}<button class="btn" onclick="logout()">Çıkış</button></div></header><div class="main"><aside class="side"><button class="btn primary newchat" onclick="newChat()">＋ Yeni sohbet</button><div class="history" id="history"></div><div class="userbar">👤 ${esc(state.user.username)} · ${state.user.role==='admin'?'Yönetici':'Kullanıcı'}</div></aside><section class="chat"><div class="messages" id="messages"><div class="inner" id="msgInner"></div></div><div class="composer"><div class="composeRow"><textarea id="input" class="input" placeholder="Bir şey sor..." onkeydown="keySend(event)"></textarea><button class="send" onclick="send()">➤</button></div><div class="meta"><span>Model: <b id="modelNow">${MODELS[state.model].name}</b></span><span>Tarama: <b id="scanCount">0</b></span><span>Cevap: <b id="respCount">0</b></span><span>Aktif sohbet: <b id="activeCount">1</b></span></div></div></section></div></div>`;selectModelUI();renderHistory();}
function selectModel(m){state.model=m;localStorage.setItem('qac_model',m);selectModelUI();loadModel(m);}
function selectModelUI(){const s=document.querySelector('.top select:nth-of-type(2)');if(s)s.value=state.model;const x=document.getElementById('modelNow');if(x)x.textContent=MODELS[state.model].name;}
async function loadModel(m){if(state.db[m])return;state.scanning++;updateMeta();const url={'flash1':'data/flash1.json','flashlite1':'data/flashlite1.json','ultra211':'data/ultra211.json'}[m];try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('veri yüklenemedi');state.db[m]=await r.json();}catch(e){state.db[m]=[];toast('Veri dosyası yüklenemedi: '+url);}finally{state.scanning=Math.max(0,state.scanning-1);updateMeta();}}
function updateMeta(){const a=document.getElementById('scanCount'),b=document.getElementById('respCount');if(a)a.textContent=state.scanning; if(b)b.textContent=state.responses;}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function addBubble(who,text,thinking=false){const inner=document.getElementById('msgInner');if(!inner)return null;const d=document.createElement('div');d.className='bubble '+(who==='user'?'me':'ai');d.innerHTML=thinking?'':esc(text);inner.appendChild(d);document.getElementById('messages').scrollTop=999999;return d;}
function thinkingNode(){const d=document.createElement('div');d.className='bubble ai';d.innerHTML='<div class="thinking"><div class="dots"><span></span><span></span><span></span></div><span class="rgb">Düşünüyor / Bilgileri tarıyor...</span></div>';document.getElementById('msgInner').appendChild(d);document.getElementById('messages').scrollTop=999999;return d;}
function normalize(s){return String(s).toLocaleLowerCase('tr-TR').replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u').trim();}
function findAnswer(q,data){const n=normalize(q);if(!data)return null;let exact=data.find(x=>normalize(x.q)===n);if(exact)return exact.a;let hit=data.find(x=>{const xq=normalize(x.q);return n.includes(xq)||xq.includes(n)});return hit?hit.a:null;}
function mathAnswer(q){let s=q.trim().toLowerCase().replace(/,/g,'.').replace(/\bx\b/g,'*').replace(/(\d+(?:\.\d+)?)\s*%/g,'($1/100)');if(!/^[0-9+\-*/().%^\s]+$/.test(s))return null;try{const expr=s.replace(/\^/g,'**');if(!expr||/[A-Za-z]/.test(expr))return null;const v=Function('"use strict";return ('+expr+')')();return Number.isFinite(v)?'Sonuç: '+v:null;}catch{return null;}}
const greetings={tr:['Selam kanka 😄 Nasılsın?','Selam! Buradayım, sorunu yaz.','Merhaba kanka 👋 Ne konuşalım?'],en:['Hey! What can I help you with?','Hi! Ask me anything.','Hello! I am ready.']};
function special(q){const n=normalize(q);if(['selam','merhaba','sa','sa kanka','selam kanka','hey'].includes(n)){const a=greetings[state.lang]||greetings.tr;return a[Math.floor(Math.random()*a.length)];}const m=mathAnswer(q);if(m)return m;return null;}
function styleAnswer(base,model,q){if(!base)return null;let t=base.trim();if(model==='flash1'){let parts=t.split(/(?<=[.!?])\s+/).slice(0,2);t=parts.join(' ');if(t.length>360)t=t.slice(0,357)+'...';return t;}if(model==='flashlite1'){return t+'\n\nKısa ek not: Bu açıklama sorunun ana kavramını ve pratik anlamını birlikte ele alır; bağlama göre ayrıntılar değişebilir.';}return t+'\n\nUltra ayrıntı: Konuyu değerlendirirken tanımı, temel mekanikleri, kullanım bağlamını ve olası istisnaları birlikte düşünmek daha sağlıklı bir çerçeve sağlar. Sorunun bağlamı değişirse uygulanacak yaklaşım da değişebilir.';}
async function getResponse(q,model){const s=special(q);if(s)return s;await loadModel(model);let base=findAnswer(q,state.db[model]);if(!base){const order=model==='flash1'?['flashlite1','ultra211']:model==='flashlite1'?['flash1','ultra211']:['flashlite1','flash1'];for(const other of order){await loadModel(other);base=findAnswer(q,state.db[other]);if(base)return (state.lang==='tr'?'Soruyu kendi veri havuzumda bulamadım; diğer modelin bilgisini kullanarak cevaplıyorum.\n\n':'I could not find it in this model\'s data, so I am using another model\'s knowledge.\n\n')+styleAnswer(base,model,q);}}return base?styleAnswer(base,model,q):(state.lang==='tr'?'Sorunun cevabı maalesef bende yok şu anda.':'I do not have an answer for that right now.');}
async function send(){const el=document.getElementById('input');const q=el.value.trim();if(!q)return;el.value='';addBubble('user',q);const node=thinkingNode();await new Promise(r=>setTimeout(r,MODELS[state.model].delay));const a=await getResponse(q,state.model);node.remove();addBubble('ai',a);state.responses++;updateMeta();state.currentChat.push({q,a});saveHistory(q,a);}
function newChat(){state.currentChat=[];const x=document.getElementById('msgInner');if(x)x.innerHTML='';renderHistory();}
function saveHistory(q,a){const h=JSON.parse(localStorage.getItem('qac_history')||'[]');h.unshift({title:q.slice(0,40),q,a,at:Date.now()});localStorage.setItem('qac_history',JSON.stringify(h.slice(0,50)));renderHistory();}
function renderHistory(){const h=JSON.parse(localStorage.getItem('qac_history')||'[]');const el=document.getElementById('history');if(!el)return;el.innerHTML=h.map((x,i)=>`<div class="hist" onclick="restoreHistory(${i})">💬 ${esc(x.title)}</div>`).join('');}
function restoreHistory(i){const h=JSON.parse(localStorage.getItem('qac_history')||'[]');const x=h[i];if(!x)return;const inner=document.getElementById('msgInner');inner.innerHTML='';addBubble('user',x.q);addBubble('ai',x.a);}
function openMulti(){document.querySelector('.multi')?.remove();const m=document.createElement('div');m.className='multi';m.innerHTML='<div class="multiBox"><div style="display:flex;justify-content:space-between;align-items:center"><h2>⚡ Multi-Chat</h2><button class="btn" onclick="this.closest(\'.multi\').remove()">✕</button></div><div style="display:flex;gap:8px;margin-bottom:12px"><input id="mq" class="field" style="margin:0" placeholder="Soruyu yaz..."><button class="btn primary" onclick="runMulti()">Gönder</button></div><div class="cards"><div class="card"><h3>⚡ Flash 1</h3><div id="mc1" class="cardBody">Bekliyor...</div></div><div class="card"><h3>🚀 Flash-Lite 1</h3><div id="mc2" class="cardBody">Bekliyor...</div></div><div class="card"><h3>🌌 Ultra 21.1</h3><div id="mc3" class="cardBody">Bekliyor...</div></div></div></div>';document.body.appendChild(m);}
async function runMulti(){const q=document.getElementById('mq').value.trim();if(!q)return;for(const id of ['mc1','mc2','mc3'])document.getElementById(id).innerHTML='<div class="thinking"><div class="dots"><span></span><span></span><span></span></div><span class="rgb">Düşünüyor / Bilgileri tarıyor...</span></div>';const ms=['flash1','flashlite1','ultra211'];const ids=['mc1','mc2','mc3'];await Promise.all(ms.map(async(m,i)=>{const a=await getResponse(q,m);document.getElementById(ids[i]).textContent=a;}));}
function setLang(l){state.lang=l;localStorage.setItem('qac_lang',l);toast(l==='tr'?'Dil: Türkçe':'Language: English');}
function toast(t){const d=document.createElement('div');d.style='position:fixed;top:70px;right:18px;background:#18181b;border:1px solid #3f3f46;padding:10px 14px;border-radius:10px;z-index:100;color:#eee';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function heartbeat(){if(!state.user)return;fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json','X-QAC-USER':state.user.username,'X-QAC-TOKEN':state.token||'local'},body:JSON.stringify({username:state.user.username,model:state.model,lang:state.lang})}).catch(()=>{});}
async function openAdmin(){if(!state.user||state.user.role!=='admin')return;const d=document.createElement('div');d.className='admin';d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2>👑 Yönetim — aktif kullanıcılar</h2><button class="btn" onclick="this.closest(\'.admin\').remove()">✕</button></div><p class="warn">Sunucu API çalışıyorsa gerçek aktiflik listesi gelir. GitHub Pages tek başına sunucu çalıştıramaz.</p><div id="users" class="adminGrid"></div>';document.body.appendChild(d);try{const r=await fetch('/api/admin/active',{headers:{'X-QAC-USER':state.user.username,'X-QAC-TOKEN':state.token||'local'}});const users=await r.json();document.getElementById('users').innerHTML=(users.users||[]).map(u=>`<div class="userCard"><div><span class="activeDot"></span><b>${esc(u.username)}</b></div><div style="color:#a1a1aa;margin-top:6px">Model: ${esc(u.model||'-')}</div><div style="color:#71717a">Dil: ${esc(u.lang||'-')}</div><div style="color:#71717a">Son sinyal: ${new Date(u.lastSeen).toLocaleString('tr-TR')}</div></div>`).join('')||'<div class="userCard">Aktif kullanıcı bulunamadı.</div>';}catch{document.getElementById('users').innerHTML='<div class="userCard">API yok. Yerel moddasın; gerçek kullanıcıları görebilmek için server.cjs ile çalıştır.</div>';}}
function logout(){localStorage.removeItem('qac_session');state.user=null;location.reload();}
const saved=JSON.parse(localStorage.getItem('qac_session')||'null');if(saved?.user){state.user=saved.user;state.token=saved.token;startApp();}else renderLogin();
</script></body></html>
